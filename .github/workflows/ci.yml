name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: cp k8s/mongo-secret.example.txt k8s/mongo-secret.txt
      - run: make validate

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
      - run: make deploy
      - run: make status
      - run: make smoke
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n minikube-practice describe pods
          kubectl -n minikube-practice logs deployment/mongo --tail=50 || true
          kubectl -n minikube-practice logs deployment/webapp --tail=50 || true
